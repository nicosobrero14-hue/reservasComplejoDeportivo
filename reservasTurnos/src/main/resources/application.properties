spring.application.name=reservasTurnos

spring.datasource.url=jdbc:mysql://localhost:3306/reservascomplejo?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# 86400000 ms = 24 horas

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL del frontend para el link de reset
app.frontend.url=http://localhost:5173

 # MercadoPago
mercadopago.access-token=${MP_ACCESS_TOKEN}
mercadopago.success-url=${MP_WEBHOOK_URL}/pagos/retorno?estado=exitoso
mercadopago.failure-url=${MP_WEBHOOK_URL}/pagos/retorno?estado=fallido
mercadopago.pending-url=${MP_WEBHOOK_URL}/pagos/retorno?estado=pendiente
mercadopago.webhook-url=${MP_WEBHOOK_URL}/pagos/webhook